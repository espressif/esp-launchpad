<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="A serial flasher utility for Espressif chips" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>ESP Launchpad</title>
    <script defer data-domain="espressif.github.io" src="https://plausible.espressif.tools/js/script.file-downloads.hash.outbound-links.manual.js"></script>
    <script>
      window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments) };
      const flashConfigURL = new URLSearchParams(window.location.search).get('flashConfigURL') || '';
      if (flashConfigURL) {
        plausible('pageview', { props: { flashConfigURL: flashConfigURL } });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
